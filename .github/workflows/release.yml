name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Crypto core tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Run crypto unit tests
        working-directory: src-tauri
        run: cargo test --lib

  build:
    name: Build ${{ matrix.label }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon)
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - label: macOS (Intel)
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg
          - label: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'MarkLock v__VERSION__'
          releaseBody: |
            本地加密 Markdown 查看 / 编辑器。Downloads below are unsigned — see README for first-launch instructions.

            | 平台 / Platform | 文件 / File |
            |---|---|
            | macOS Apple Silicon | `*_aarch64.dmg` |
            | macOS Intel | `*_x64.dmg` |
            | Windows x64 | `*_x64-setup.exe` |
          releaseDraft: true
          prerelease: false
          includeUpdaterArtifacts: false
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
