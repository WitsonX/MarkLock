[package]
name = "marklock"
version = "1.1.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "marklock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 加密核心
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
# 密钥内存清零
zeroize = { version = "1", features = ["derive"] }
tauri-plugin-window-state = "2"

# Windows 双击/右键打开文件：二次启动把参数转发给已运行实例（仅 Windows 启用）
[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-single-instance = "2"

# 便签定位读 NSScreen.visibleFrame 剔除菜单栏/Dock（tauri 依赖树里已有此 crate，不引入新下载）
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSScreen"] }
# iCloud 未下载文件主动召回：NSFileManager startDownloadingUbiquitousItemAtURL（同在依赖树内）
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
